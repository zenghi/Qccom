name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/qccom.exe
            name: qccom-windows-x64.exe
          # oldest supported runner, so the binary works on older glibc distributions
          - os: ubuntu-22.04
            bin: target/release/qccom
            name: qccom-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Rename
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.bin }}" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

      # Code signing (enable after the project is accepted by the SignPath Foundation):
      # 1. Add SIGNPATH_API_TOKEN under Settings -> Secrets and variables -> Actions. Never commit it.
      # 2. Fill in organization-id / project-slug / signing-policy-slug from the SignPath dashboard.
      # 3. Remove `false &&` from the condition below.
      - name: Sign with SignPath
        if: false && runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "<organization id>"
          project-slug: "qccom"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum qccom-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
