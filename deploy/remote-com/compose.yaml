services:
  rendezvous:
    image: ghcr.io/fatedier/frps:v0.72.0@sha256:17abb20dd392557a44070d9726954630c0eb1f7a9bd6ead5ae9150d165179ea4
    command: ["-c", "/config/frps.toml"]
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["7000:7000/tcp"]
    volumes: ["./pair/server:/config:ro"]
    logging:
      options: {max-size: "5m", max-file: "2"}
