[package]
name = "qccom-tunnel"
version = "1.9.8"
edition = "2021"
license = "Apache-2.0"

[features]
endpoint = ["dep:iroh"]
server = ["iroh-relay/server", "dep:rcgen", "dep:rustls", "dep:tempfile", "tokio/signal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
iroh-base = { version = "1.5", features = ["key", "relay"] }
iroh = { version = "1.5", default-features = false, features = ["tls-ring"], optional = true }
iroh-relay = { version = "1.5", default-features = false, features = ["tls-ring"] }
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[[bin]]
name = "qccom-server"
path = "src/server.rs"
required-features = ["server"]

[[example]]
name = "tunnel-worker"
path = "examples/worker.rs"
required-features = ["endpoint"]

[target.'cfg(windows)'.dependencies]
serialport = "4"
windows-sys = { version = "0.61", features = ["Win32_System_IO", "Win32_System_Ioctl", "Win32_Devices_Communication"] }
