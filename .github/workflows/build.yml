name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/qccom.exe
            name: qccom-windows-x64.exe
          # oldest supported runner, so the binary works on older glibc distributions
          - os: ubuntu-22.04
            bin: target/release/qccom
            name: qccom-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check SignPath configuration
        if: runner.os == 'Windows' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          SIGNPATH_CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if ($env:SIGNPATH_CONFIGURED -ne 'true') {
            $message = 'Configure SIGNPATH_ORGANIZATION_ID and SIGNPATH_API_TOKEN to sign Windows releases.'
            if ($env:GITHUB_REF -like 'refs/tags/v*') { throw $message }
            Write-Output "::notice::$message"
          } else {
            Write-Output 'SignPath configuration is present.'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Rename
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.bin }}" "dist/${{ matrix.name }}"

      - name: Pack Windows x64 and verify byte-exact restoration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'upx-5.3.0-win64.zip'
          Invoke-WebRequest 'https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'd127996c76615e431be810e9c8d2910dbe3dd400600c5c0c50276fc5a17a9705') { throw 'UPX checksum mismatch' }
          Expand-Archive $archive $env:RUNNER_TEMP
          ./deploy/windows/pack-release.ps1 -Executable '${{ matrix.bin }}' -Destination 'dist/${{ matrix.name }}' -Upx (Join-Path $env:RUNNER_TEMP 'upx-5.3.0-win64/upx.exe')

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

      # Each release signing request waits for manual approval in SignPath.
      - name: Version
        id: ver
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sign with SignPath
        id: sign
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'qccom' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Check signature
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature "dist/signed/${{ matrix.name }}"
          $s | Format-List Status, StatusMessage, SignerCertificate
          if ($s.Status -ne 'Valid') { throw "signature is not valid" }

      - uses: actions/upload-artifact@v4
        if: steps.sign.outcome == 'success'
        with:
          name: signed-${{ matrix.name }}
          path: dist/signed/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p dist
          cp artifacts/signed-qccom-windows-x64.exe/qccom-windows-x64.exe dist/
          cp artifacts/qccom-linux-x64/qccom-linux-x64 dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum qccom-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
