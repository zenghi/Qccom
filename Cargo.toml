[package]
name = "qccom"
version = "1.4.0"
edition = "2021"
description = "Lightweight serial / TCP / UDP / MQTT / BLE / HTTP debug tool with a VT100 terminal, C code viewer and Git browser"
authors = ["zenghi <https://github.com/zenghi>"]
license = "Apache-2.0"
repository = "https://github.com/zenghi/QCCOM"
homepage = "https://github.com/zenghi/QCCOM"
readme = "README.md"
keywords = ["serial", "uart", "mqtt", "terminal", "embedded"]
categories = ["development-tools", "embedded", "gui"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "persistence"] }
serialport = "4"
rfd = "0.15"
chrono = "0.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
memmap2 = "0.9.11"
vte = { version = "0.13", default-features = false }
serde_json = "1"
sys-locale = "0.3"
sha2 = { version = "0.10", default-features = false }
portable-pty = "0.9"
regex-lite = "0.1"
# BLE: btleplug is async, it runs on a single-threaded tokio runtime in its own thread
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
uuid = "1"
# USB HID debugging (hidraw on Linux, native API on Windows)
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw", "windows-native"] }
# Toolbox: glyph bitmaps (font modulo) and image to C array
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rhai = { version = "1.23", default-features = false, features = ["std", "no_module", "no_custom_syntax"] }

# HTTPS (self-update) and MQTT over TLS: Windows uses the system SChannel, which adds almost nothing to the size;
# Linux uses pure-Rust rustls so it does not depend on the distribution's OpenSSL version
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
