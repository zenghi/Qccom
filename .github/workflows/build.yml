name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: target/release/qccom.exe
            name: qccom-windows-x64.exe
          # oldest supported runner, so the binary works on older glibc distributions
          - os: ubuntu-22.04
            bin: target/release/qccom
            name: qccom-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Rename
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.bin }}" "dist/${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

      # Code signing via SignPath (free for open source, see CODE_SIGNING.md). Runs only for v* tags and
      # only after the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist,
      # so the workflow behaves as before until the project is set up in SignPath.
      # Each request waits for manual approval in SignPath.
      - name: Version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sign with SignPath
        id: sign
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'qccom' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Check signature
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature "dist/signed/${{ matrix.name }}"
          $s | Format-List Status, StatusMessage, SignerCertificate
          if ($s.Status -ne 'Valid') { throw "signature is not valid" }

      - uses: actions/upload-artifact@v4
        if: steps.sign.outcome == 'success'
        with:
          name: signed-${{ matrix.name }}
          path: dist/signed/${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Prefer the signed Windows build when there is one
      - name: Collect files
        run: |
          mkdir -p dist
          for d in artifacts/qccom-*; do
            n=$(basename "$d")
            if [ -f "artifacts/signed-$n/$n" ]; then
              echo "$n: signed"
              cp "artifacts/signed-$n/$n" "dist/$n"
            else
              echo "$n: unsigned"
              cp "$d/$n" "dist/$n"
            fi
          done
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: sha256sum qccom-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
